name: Validate theme
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm test
      - run: npm run test:browser
      - run: git diff --exit-code -- dist releases docs pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolpivio-v4-browser-screenshots
          retention-days: 7
          if-no-files-found: ignore
          path: |
            work/v4-cards-1440.png
            work/v4-touch-390.png
            work/v4-banner-roas-360.png
            work/v4-banner-about.png
            work/contact-inactive-390.png
            work/contact-configured-test-390.png
