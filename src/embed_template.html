<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,follow"><title>ToolPivio Calculators</title><style>@@TOOLPIVIO_CSS@@
body{background:#fff;margin:0;min-width:280px;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif} .embed-wrap{max-width:900px;margin:0 auto;padding:14px 6px 30px} .embed-wrap h2{font-size:23px;color:#12283e;margin:0 0 6px}.embed-wrap>p{font-size:14px;color:#526579;margin:0 0 8px}.embed-wrap .calculator{margin:12px 0 0;padding:22px;border:1px solid #dae4e9} .embed-wrap .result{margin-top:12px}.embed-wrap .fields{gap:14px} .embed-wrap input,.embed-wrap select{padding:10px 12px} .embed-wrap .actions{margin-top:16px} @media (max-width:650px){.embed-wrap{padding:8px 2px 20px}.embed-wrap .fields{grid-template-columns:1fr}.embed-wrap .calculator{padding:14px}.embed-wrap h2{font-size:20px}}</style></head><body><main class="embed-wrap"><h2 id="tool-title">Calculator</h2><p id="tool-help">Enter your values to calculate.</p><div id="calculator-host"></div></main><script>(function(){const options={"roas":["ROAS Calculator","Measure advertising revenue relative to ad spend. Use the same currency for both values."],"margin":["Profit Margin Calculator","Estimate profit and profit margin after relevant costs. Use the same currency for revenue and cost."],"dpi":["Print Resolution Calculator","Check horizontal and vertical image resolution at a chosen print size (PPI, often called print DPI)."]};const selected=new URLSearchParams(location.search).get('tool')||'roas';const key=Object.prototype.hasOwnProperty.call(options,selected)?selected:'roas';document.getElementById('tool-title').textContent=options[key][0];document.getElementById('tool-help').textContent=options[key][1];document.getElementById('calculator-host').setAttribute('data-tool',key);document.title=options[key][0]+' | ToolPivio';})();</script><script>@@TOOLPIVIO_CALCULATORS_JS@@</script><script>@@TOOLPIVIO_APP_JS@@</script></body></html>
